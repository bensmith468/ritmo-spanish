<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Learn Spanish little by little. Offline lessons and spaced-repetition flashcards.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ritmo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Ritmo • Spanish that sticks</title>
</head>
<body>
  <div id="app-shell" class="shell">
    <header class="topbar">
      <button type="button" class="brand" data-page="home" aria-label="Ritmo home">
        <span class="brand-mark" aria-hidden="true">r<span class="brand-dot">.</span></span>
        <span class="brand-name">ritmo<span class="brand-star">✳</span><small>SPANISH, ONE WORD AT A TIME</small></span>
      </button>
      <span id="connection-badge" class="connection" role="status" aria-live="polite">Checking offline access…</span>
    </header>
    <main id="view" tabindex="-1" aria-live="off">
      <div class="loading-screen"><span class="loading-mark">r.</span><p>Preparing your Spanish lessons…</p></div>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-page="home" class="nav-item active" aria-current="page"><span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span></button>
      <button type="button" data-page="reviews" class="nav-item"><span class="nav-icon" aria-hidden="true">↻</span><span>Reviews</span><span id="nav-due" class="nav-count" hidden>0</span></button>
      <button type="button" data-page="lessons" class="nav-item"><span class="nav-icon" aria-hidden="true">✳</span><span>Lessons</span></button>
      <button type="button" data-page="library" class="nav-item"><span class="nav-icon" aria-hidden="true">▤</span><span>Words</span></button>
      <button type="button" data-page="settings" class="nav-item"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
